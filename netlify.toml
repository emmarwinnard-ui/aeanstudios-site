# Static site: no build step, Netlify publishes the repository root.
[build]
  publish = "."
  command = ""

# The plan builder's AI function (netlify/functions/plan.mjs), served at /api/plan.
# It needs ANTHROPIC_API_KEY set under Site configuration > Environment variables.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
